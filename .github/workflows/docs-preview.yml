name: docs-preview

on:
  push:
    branches: [main]
    paths:
      - "docs/portal/**"
      - "scripts/portal-assets.mjs"
      - "apps/web/design-tokens.css"
      - "apps/web/public/logo-mark.svg"
      - "openapi/openapi.json"
      - ".github/workflows/docs-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static portal
        run: |
          set -euo pipefail
          node scripts/portal-assets.mjs site
          test -s site/docs/portal/index.html
          test -s site/openapi/openapi.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
