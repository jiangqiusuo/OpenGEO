<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenGEO API Reference</title>
    <meta name="description" content="OpenGEO Community API Developer Portal" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f5f3ed; }
      .portal-header { position: fixed; inset: 0 0 auto; z-index: 2; height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 10px; color: #fff; background: #171914; font: 600 14px Inter, system-ui, sans-serif; }
      .portal-mark { width: 18px; height: 18px; display: inline-block; background: linear-gradient(90deg, #c7f36b 0 30%, transparent 30% 35%, #c7f36b 35% 65%, transparent 65% 70%, #c7f36b 70%); }
      .portal-header small { margin-left: auto; color: #a5a89a; font: 10px ui-monospace, monospace; }
      #scalar { padding-top: 48px; }
    </style>
  </head>
  <body>
    <header class="portal-header"><span class="portal-mark" aria-hidden="true"></span>OpenGEO <small>Community API · OpenAPI 3.1</small></header>
    <div id="scalar"></div>
    <script id="api-reference" data-url="../../openapi/openapi.json"></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest"></script>
  </body>
</html>
